<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Admin - Inventario</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f4f6f9; }
    .sidebar {
      width: 250px; height: 100vh; background: #1e293b; color: white;
      position: fixed; padding: 20px;
    }
    .sidebar h2 { margin-bottom: 30px; color: #38bdf8; }
    .sidebar a {
      display: block; color: #cbd5e1; padding: 12px; text-decoration: none;
      border-radius: 8px; margin-bottom: 8px;
    }
    .sidebar a:hover, .sidebar a.active { background: #334155; color: white; }
    .main { margin-left: 250px; padding: 30px; }
    .header { display: flex; justify-content: space-between; margin-bottom: 30px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
    .card {
      background: white; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card h3 { color: #64748b; font-size: 14px; margin-bottom: 10px; }
    .card .num { font-size: 32px; font-weight: bold; color: #1e293b; }
    .card.warning .num { color: #f59e0b; }
    .card.danger .num { color: #ef4444; }
    .card.success .num { color: #10b981; }
    
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
    .toolbar input, .toolbar select {
      padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px;
    }
    .toolbar input { flex: 1; }
    .btn {
      padding: 10px 20px; border: none; border-radius: 8px;
      cursor: pointer; font-weight: 600;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-success { background: #10b981; color: white; }
    
    table { width: 100%; background: white; border-radius: 12px; overflow: hidden; }
    th { background: #f1f5f9; padding: 15px; text-align: left; font-size: 13px; color: #475569; }
    td { padding: 15px; border-top: 1px solid #f1f5f9; }
    tr:hover { background: #f8fafc; }
    
    .badge {
      padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .badge-ok { background: #d1fae5; color: #065f46; }
    .badge-low { background: #fef3c7; color: #92400e; }
    .badge-out { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>🔧 TallerPro</h2>
    <a href="#" class="active">📊 Dashboard</a>
    <a href="#">📦 Inventario</a>
    <a href="#">📋 Órdenes</a>
    <a href="#">👥 Usuarios</a>
    <a href="#" onclick="logout()">🚪 Salir</a>
  </div>

  <div class="main">
    <div class="header">
      <h1>Inventario del Taller</h1>
      <button class="btn btn-primary" onclick="abrirModal()">+ Nuevo Repuesto</button>
    </div>

    <div class="cards">
      <div class="card">
        <h3>Total Productos</h3>
        <div class="num" id="total-productos">0</div>
      </div>
      <div class="card success">
        <h3>Valor Inventario</h3>
        <!-- Aquí mostramos el valor total en CLP -->
        <div class="num" id="valor-inventario">$0</div>
      </div>
      <div class="card warning">
        <h3>Stock Bajo</h3>
        <div class="num" id="stock-bajo">0</div>
      </div>
      <div class="card danger">
        <h3>Sin Stock</h3>
        <div class="num" id="stock-agotado">0</div>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="buscar" placeholder="🔍 Buscar por nombre, código o marca..." oninput="renderTabla()">
      <select id="filtro-stock" onchange="renderTabla()">
        <option value="">Todo el stock</option>
        <option value="bajo">Stock bajo</option>
        <option value="agotado">Agotado</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Producto</th>
          <th>Marca</th>
          <th>Stock</th>
          <th>P. Compra</th>
          <th>P. Venta</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-inventario"></tbody>
    </table>
  </div>

  <script>
    // INVENTARIO DE EJEMPLO (Luego se conectará a Oracle)
    let inventario = [
      { id:1, codigo:'REP-001', nombre:'Filtro de aceite Toyota', marca:'Bosch', stock:25, min:5, pc:8500, pv:15000 },
      { id:2, codigo:'REP-002', nombre:'Pastillas de freno delanteras', marca:'Brembo', stock:12, min:4, pc:35000, pv:65000 },
      { id:3, codigo:'LUB-001', nombre:'Aceite Motor 10W-40 (5L)', marca:'Mobil', stock:40, min:10, pc:22000, pv:38000 },
      { id:4, codigo:'REP-003', nombre:'Bujía de encendido NGK', marca:'NGK', stock:3, min:8, pc:4000, pv:9500 },
      { id:5, codigo:'NEU-001', nombre:'Neumático 195/65 R15', marca:'Michelin', stock:8, min:4, pc:70000, pv:120000 },
      { id:6, codigo:'ELE-001', nombre:'Batería 12V 60Ah', marca:'Bosch', stock:0, min:3, pc:80000, pv:150000 }
    ];

    // FUNCIÓN PARA FORMATEAR A PESOS CHILENOS (CLP)
    // Usa el estándar de Chile: puntos para miles, sin decimales.
    function formatoCLP(valor) {
      return new Intl.NumberFormat('es-CL', {
        style: 'currency',
        currency: 'CLP',
        minimumFractionDigits: 0
      }).format(valor);
    }

    function renderTabla() {
      const buscar = document.getElementById('buscar').value.toLowerCase();
      const filtroStock = document.getElementById('filtro-stock').value;

      let filtrados = inventario.filter(p => {
        const coincideBusqueda = p.nombre.toLowerCase().includes(buscar) ||
                                 p.codigo.toLowerCase().includes(buscar) ||
                                 p.marca.toLowerCase().includes(buscar);
        let coincideStock = true;
        if (filtroStock === 'bajo') coincideStock = p.stock > 0 && p.stock <= p.min;
        if (filtroStock === 'agotado') coincideStock = p.stock === 0;
        return coincideBusqueda && coincideStock;
      });

      const tbody = document.getElementById('tabla-inventario');
      tbody.innerHTML = filtrados.map(p => {
        let badge = '';
        if (p.stock === 0) badge = '<span class="badge badge-out">Agotado</span>';
        else if (p.stock <= p.min) badge = '<span class="badge badge-low">Stock bajo</span>';
        else badge = '<span class="badge badge-ok">OK</span>';
        
        return `<tr>
          <td><strong>${p.codigo}</strong></td>
          <td>${p.nombre}</td>
          <td>${p.marca}</td>
          <td>${p.stock} ${badge}</td>
          <td>${formatoCLP(p.pc)}</td>
          <td>${formatoCLP(p.pv)}</td>
          <td>
            <button class="btn btn-success" onclick="ajustarStock(${p.id}, 1)">+</button>
            <button class="btn btn-danger" onclick="ajustarStock(${p.id}, -1)">-</button>
          </td>
        </tr>`;
      }).join('');

      // Calcular KPIs
      document.getElementById('total-productos').textContent = inventario.length;
      
      // Calcular el valor total del inventario (Stock * Precio Compra)
      const valorTotal = inventario.reduce((acc, p) => acc + (p.stock * p.pc), 0);
      document.getElementById('valor-inventario').textContent = formatoCLP(valorTotal);

      document.getElementById('stock-bajo').textContent = inventario.filter(p => p.stock > 0 && p.stock <= p.min).length;
      document.getElementById('stock-agotado').textContent = inventario.filter(p => p.stock === 0).length;
    }

    function ajustarStock(id, delta) {
      const p = inventario.find(x => x.id === id);
      if (p.stock + delta < 0) return;
      p.stock += delta;
      renderTabla();
    }

    function abrirModal() {
      // Simulación rápida de agregar (luego haremos un formulario modal bonito)
      const codigo = prompt('Código del repuesto:');
      if (!codigo) return;
      const nombre = prompt('Nombre:');
      const marca = prompt('Marca:');
      const stock = parseInt(prompt('Stock inicial:') || '0');
      const pc = parseInt(prompt('Precio compra (en pesos, sin puntos):') || '0');
      const pv = parseInt(prompt('Precio venta (en pesos, sin puntos):') || '0');

      inventario.push({
        id: Date.now(), codigo, nombre, marca,
        stock, min: 5, pc, pv
      });
      renderTabla();
    }

    function logout() {
      window.location.href = 'index.html';
    }

    // Inicializar tabla
    renderTabla();
  </script>
</body>
</html>
