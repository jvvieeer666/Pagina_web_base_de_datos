<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Mecánico - Iniciar Sesión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-container h1 { color: #1e293b; margin-bottom: 10px; font-size: 24px; }
        .login-container p { color: #64748b; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; color: #475569; font-size: 14px; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #3b82f6; }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover { background: #2563eb; }
        .msg-error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: left;
        }
        .roles-info {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>🔧 TallerPro</h1>
        <p>Ingresa a tu cuenta para continuar</p>

        <!-- Apunta a login.php y usa método POST -->
        <div id="msg-error" class="msg-error" role="alert"></div>

        <form action="login.php" method="POST">
            <div class="form-group">
                <label for="rut">RUT / Usuario</label>
                <!-- El name="rut" es vital para que PHP lo reciba -->
                <input type="text" id="rut" name="rut" placeholder="Ej: 12.345.678-9" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <!-- El name="password" es vital -->
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="form-group">
                <label for="rol">Tipo de Usuario</label>
                <!-- El name="rol" es vital -->
                <select id="rol" name="rol" required>
                    <option value="">Seleccione su rol...</option>
                    <option value="admin">Administrador</option>
                    <option value="mecanico">Mecánico</option>
                    <option value="cliente">Cliente</option>
                </select>
            </div>

            <button type="submit" class="btn-login">Ingresar al Sistema</button>
        </form>

        <div class="roles-info">
            Sistema de Gestión de Taller Mecánico - Chile 🇨🇱
        </div>
    </div>

    <script>
        // login.php vuelve aquí con ?error=N cuando algo falla
        const mensajes = {
            1: 'RUT o contraseña incorrectos.',
            2: 'Demasiados intentos fallidos. Espera 15 minutos e inténtalo de nuevo.',
            3: 'No se pudo completar el inicio de sesión. Intenta nuevamente.'
        };
        const codigo = new URLSearchParams(location.search).get('error');
        if (codigo && mensajes[codigo]) {
            const caja = document.getElementById('msg-error');
            caja.textContent = mensajes[codigo];
            caja.style.display = 'block';
        }
    </script>


</body>
</html>
